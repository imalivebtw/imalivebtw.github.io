body {
  align-items: center;

  height: 100vh;

  margin: 0;

}

.loader {

  font-size: 4rem;
  font-weight: 100;
  height: 1em;
  justify-content: center;
  width: 1.2em;
}

.loader::before {
  animation: load 1.5s alternate 0s infinite;
  content: ' ';
}

@keyframes load {
    /*"·", "✻", "✽", "✶", "✳", "✢"*/
    10% {font-weight: bold; content: "·";}
    20% {content: "✻"}
    36% {content: "✽"}
    67% {content: "✶"}
    84% {content: "✳"}
    100% {content: "✢"}
}
