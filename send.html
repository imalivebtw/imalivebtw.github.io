<!DOCTYPE html>
<html>
    <head>
	<meta charset="unicode">
        <title>send button</title>
    </head>
    <body>
        <div class="buttons" onmouseover="glide()" onmouseleave="unglide()" onclick="fly()">
            <a id="send">send</a>
            <a id="icon">➤</a>
        </div>
    </body>
    <style>
        html{
            background-color: black;
            text-align: center;
        }
        .buttons{
            user-select: none;
            overflow: hidden;
            cursor: pointer;
            display: inline-block;
            background-color: rgb(0, 132, 255);
            color: rgb(255, 255, 255);
            border-radius: 8px;
            padding: 0.3cm;
            transform: scale(3) translateY(290%);
            transition: 0.3s;
        }
        .buttons:hover{
            background-color: rgb(0, 140, 255);
        }
        #icon{
            display: inline-block;
            transform: rotate(-45deg);
        }
        #send{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            letter-spacing: -0.7px;
        }
        @keyframes float{
            from{ transform: rotate(-45deg) translateY(0); }
            to{ transform: rotate(-45deg) translateY(-8px); }
        }
    </style>
    <script>
        function glide(){
            document.getElementById('send').style = 'transition: 300ms; display: inline-block; transform: translateX(-100px);'
            document.getElementById('icon').style = 'transition: 300ms; display: inline-block; transform: translateX(-17px);'
        }
        function unglide(){
            document.getElementById('send').style = 'display: inline-block; transition: 300ms;'
            document.getElementById('icon').style = 'display: inline-block; transition: 300ms;'
        }
        function fly(){
            document.getElementById('icon').style = 'transition: 300ms; display: inline-block; transform: translateX(30px);'
        }
    </script>
</html>
